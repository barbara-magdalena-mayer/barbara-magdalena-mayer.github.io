<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Der Fürsorge-Kompass</title><desc id="desc">Vier Bereiche der Selbstfürsorge: Körper, Gefühle, Beziehungen und Orientierung.</desc><rect width="1000" height="620" rx="28" fill="#f7f4ee"/><circle cx="500" cy="335" r="140" fill="#fff" stroke="#0f3d4c" stroke-width="5"/><path d="M500 195v280M360 335h280" stroke="#bfd6d1" stroke-width="3"/><path d="M500 215l24 120-24 0-24 0z" fill="#e89178"/><path d="M500 455l-24-120 24 0 24 0z" fill="#176b68"/><circle cx="500" cy="335" r="24" fill="#0f3d4c"/><g font-family="Arial, sans-serif" fill="#0f3d4c"><text x="500" y="60" text-anchor="middle" font-size="32" font-weight="700">Der Fürsorge-Kompass</text><text x="500" y="96" text-anchor="middle" font-size="20" fill="#56706d">Bewerte jeden Bereich von 1 bis 10</text><text x="500" y="146" text-anchor="middle" font-size="27" font-weight="700">ORIENTIERUNG</text><text x="500" y="176" text-anchor="middle" font-size="18">Reflexion · Lernen · Leben außerhalb der Arbeit</text><text x="500" y="530" text-anchor="middle" font-size="27" font-weight="700">KÖRPER</text><text x="500" y="562" text-anchor="middle" font-size="18">Schlaf · Essen · Bewegung · Erholung</text><text x="330" y="322" text-anchor="end" font-size="27" font-weight="700">GEFÜHLE</text><text x="330" y="354" text-anchor="end" font-size="18">Wahrnehmen · Ausdrücken</text><text x="330" y="378" text-anchor="end" font-size="18">· Regulieren</text><text x="670" y="322" font-size="27" font-weight="700">BEZIEHUNGEN</text><text x="670" y="354" font-size="18">Menschen, die dir guttun</text></g></svg>
