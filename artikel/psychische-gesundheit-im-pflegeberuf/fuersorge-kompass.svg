<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Der Fürsorge-Kompass</title><desc id="desc">Vier Bereiche der Selbstfürsorge: Körper, Gefühle, Beziehungen und Orientierung.</desc><rect width="1000" height="620" rx="28" fill="#f7f4ee"/><circle cx="500" cy="315" r="170" fill="#fff" stroke="#0f3d4c" stroke-width="5"/><path d="M500 145v340M330 315h340" stroke="#bfd6d1" stroke-width="3"/><path d="M500 165l28 150-28 0-28 0z" fill="#e89178"/><path d="M500 465l-28-150 28 0 28 0z" fill="#176b68"/><circle cx="500" cy="315" r="27" fill="#0f3d4c"/><g font-family="Arial, sans-serif" fill="#0f3d4c"><text x="500" y="65" text-anchor="middle" font-size="32" font-weight="700">Der Fürsorge-Kompass</text><text x="500" y="104" text-anchor="middle" font-size="20" fill="#56706d">Bewerte jeden Bereich von 1 bis 10</text><text x="500" y="190" text-anchor="middle" font-size="27" font-weight="700">ORIENTIERUNG</text><text x="500" y="225" text-anchor="middle" font-size="18">Reflexion · Lernen · Leben außerhalb der Arbeit</text><text x="500" y="565" text-anchor="middle" font-size="27" font-weight="700">KÖRPER</text><text x="500" y="595" text-anchor="middle" font-size="18">Schlaf · Essen · Bewegung · Erholung</text><text x="170" y="305" text-anchor="middle" font-size="27" font-weight="700">GEFÜHLE</text><text x="170" y="340" text-anchor="middle" font-size="18">Wahrnehmen · Ausdrücken · Regulieren</text><text x="830" y="305" text-anchor="middle" font-size="27" font-weight="700">BEZIEHUNGEN</text><text x="830" y="340" text-anchor="middle" font-size="18">Menschen, die dir guttun</text></g></svg>
