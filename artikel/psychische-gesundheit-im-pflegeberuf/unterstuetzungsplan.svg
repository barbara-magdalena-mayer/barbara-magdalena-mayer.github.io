<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Persönlicher Unterstützungsplan</title><desc id="desc">Drei Felder für Warnsignale, kurzfristig hilfreiche Schritte und Ansprechpersonen.</desc><rect width="1000" height="650" rx="24" fill="#eef5f3"/><text x="500" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f3d4c">Mein persönlicher Unterstützungsplan</text><g font-family="Arial, sans-serif"><rect x="55" y="105" width="890" height="130" rx="18" fill="#fff" stroke="#176b68" stroke-width="3"/><text x="85" y="145" font-size="25" font-weight="700" fill="#176b68">1 · Meine Warnsignale</text><text x="85" y="185" font-size="20" fill="#405b58">Woran merke ich, dass meine Belastung steigt?</text><line x1="85" y1="210" x2="900" y2="210" stroke="#b9ccc8" stroke-width="2"/><rect x="55" y="260" width="430" height="300" rx="18" fill="#fff" stroke="#e89178" stroke-width="3"/><text x="85" y="305" font-size="25" font-weight="700" fill="#c76655">2 · Was hilft kurzfristig?</text><text x="85" y="345" font-size="19" fill="#405b58">Nur wenn es sicher möglich ist:</text><text x="95" y="395" font-size="20" fill="#405b58">☐ Wasser trinken</text><text x="95" y="435" font-size="20" fill="#405b58">☐ Unterstützung holen</text><text x="95" y="475" font-size="20" fill="#405b58">☐ kurz orientieren / atmen</text><text x="95" y="515" font-size="20" fill="#405b58">☐ Nachbesprechung vereinbaren</text><rect x="515" y="260" width="430" height="300" rx="18" fill="#fff" stroke="#0f3d4c" stroke-width="3"/><text x="545" y="305" font-size="25" font-weight="700" fill="#0f3d4c">3 · Wen spreche ich an?</text><text x="545" y="360" font-size="20" fill="#405b58">Kollegium / Praxisanleitung</text><text x="545" y="405" font-size="20" fill="#405b58">Leitung / Supervision</text><text x="545" y="450" font-size="20" fill="#405b58">Betriebsarzt / Beratung</text><text x="545" y="495" font-size="20" fill="#405b58">Hausarzt / Psychotherapie</text></g></svg>
